<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Uploaded Image</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        img {
            max-width: 600px;
            max-height: 500px;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <h1>Image Uploaded Successfully</h1>

    <p>
        File: {{ file_name }}
    </p>

    <img
        src="{{ image_url }}"
        alt="Uploaded Image"
    >

    <br>

    <a href="/">
        Upload Another Image
    </a>

</body>

</html>
